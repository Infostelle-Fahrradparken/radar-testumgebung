<style>
:root{--g:#63A615;--gd:#415E22;--g2:#4F732A;--bg:#EDF7DF;--line:#E3E9DC;--text:#1D2416;--muted:#5b6553;--warn:#9a6b00}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8f3;color:var(--text);font:400 16px/1.5 Inter,system-ui,sans-serif;padding:16px}
form{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 24px}
.mark{width:36px;height:36px;border-radius:9px;background:var(--g);margin-bottom:16px}
h1{font-size:20px;font-weight:700;margin:0 0 4px}
p{margin:0 0 20px;color:var(--muted);font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid #cdd6c3;border-radius:8px;outline:none}
input[type=password]:focus{border-color:var(--g);box-shadow:0 0 0 3px #D0EAA6}
.keep{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:12px 0 18px;font-weight:400}
button{width:100%;font:600 15px Inter,system-ui,sans-serif;padding:11px;border:0;border-radius:8px;background:var(--g);color:#fff;cursor:pointer}
button:hover{background:var(--g2)}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:20px;margin:12px 0 0;font-size:14px;color:var(--warn)}
</style>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const SK="fpr-test-key";
async function keyFromPw(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:u(B.salt),iterations:B.iter},base,256));
}
async function open(raw){
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(B.iv)},k,u(B.ct));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
const enc=a=>btoa(String.fromCharCode(...a));
window.addEventListener("load",async()=>{let s=null;try{s=localStorage.getItem(SK)||sessionStorage.getItem(SK)}catch(e){}
  if(s){try{await open(u(s))}catch(e){try{localStorage.removeItem(SK);sessionStorage.removeItem(SK)}catch(_){}}}});
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const go=document.getElementById("go"),msg=document.getElementById("msg");
  go.disabled=true;msg.textContent="";
  try{const raw=await keyFromPw(document.getElementById("pw").value);
    try{(document.getElementById("keep").checked?localStorage:sessionStorage).setItem(SK,enc(raw))}catch(_){}
    await open(raw);
  }catch(err){msg.textContent="Das Passwort stimmt nicht.";go.disabled=false;try{localStorage.removeItem(SK);sessionStorage.removeItem(SK)}catch(_){}}
});
</script>
